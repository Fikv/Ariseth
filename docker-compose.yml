name: ariseth

services:
  db:
    image: postgres:16-alpine
    container_name: ariseth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ariseth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - ariseth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ariseth}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ariseth-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ariseth-app:latest
    container_name: ariseth-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ariseth}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SECURITY_BCRYPT_STRENGTH: ${SECURITY_BCRYPT_STRENGTH:-12}
      BCRYPT_VERISON: ${BCRYPT_VERISON:-2A}
      SERVER_PORT: "8080"
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - ariseth-net

volumes:
  ariseth-db-data:

networks:
  ariseth-net:
    driver: bridge
